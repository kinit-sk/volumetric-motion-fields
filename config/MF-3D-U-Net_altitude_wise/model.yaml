architecture: "MF-3D-U-Net_altitude_wise"
# Parameters for training model
train_params:
  device: cuda:0
  #device: cpu
  train_batch_size: 1
  valid_batch_size: 2
  test_batch_size: 1
  predict_batch_size: 2
  max_epochs: 9999
  # Max time used for training (days:hours:mins:secs)
  max_time: "99:00:00:00"
  # Validate after every n batches
  val_check_interval: 1.0
  num_workers: 0
  gpus: 1
  savefile: "Nowcasting_SVK_dualpol"
  # many leadtimes
  verif_leadtimes: 16
  # number of batches to validate on
  val_batches: 9999999
  # number of baches to train on (per epoch)
  train_batches: 1000
  early_stopping:
    strict: false
    verbose: true
    monitor: "val_loss"
    patience: 16
  lr_scheduler:
    name: "ExponentialLR"
    kwargs:
      gamma : 0.95
  weights_exp: 1.0

model:
  lr: 1e-04
  disc_lr_coef: 0.1
  rainnet:
    output_shape: [1, 16, 512, 512]
    kernel_size: 3
    mode: "motion_field"
    conv_shape:
      [
        ["1", [1, 16]],
        ["2", [16, 32]],
        ["3", [32, 64]],
        ["4", [64, 128]],
        ["5", [128, 256]],
        ["6", [384, 128]],
        ["7", [192, 64]],
        ["8", [96, 32]],
        ["9", [48, 16]]
      ]

  loss:
    name: "mse"
    loss_ignore_value: -15.01
  phys_loss:
    beta: 0.5
  train_leadtimes: 16
prediction:
  predict_leadtimes: 16
prediction_output:
  # Output directory
  output_dir: /scratch/p709-24-2/outputs/MF-U-Net/
  filename: mfunet.h5
  group_format: "{common_time:%Y-%m-%d %H:%M:%S}/model"
  # Attributes of the dataset in the HDF5 file
  what_attrs:
    quantity: DBZH
    gain: 0.5
    offset: -32
    nodata: 255
    undetect: 0